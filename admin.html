<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack - Administration</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-800 text-gray-100 min-h-screen flex flex-col">
    <header class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="flex items-center gap-3">
            <img src="image/logo2.png" alt="Logo CinéTrack" class="w-10 h-10 sm:w-12 sm:h-12"> 

            <h1 class="text-xl sm:text-2xl font-bold text-red-500">
                Administration CinéTrack
            </h1>
            
            <a href="index.html" class="ml-auto bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">Retour au catalogue    
            </a>
        </div>    
    </header>

    <main class="flex-1 p-4 sm:p-6">

        <h2 class="text-2xl font-bold mb-6">Liste des contenues</h2>

        <input type="text" id="title" placeholder="Titre" class="w-full p-3 rounded bg-gray-700 text-white">
        <p id="error-title" class="text-red-500 text-sm"></p>

        <select id="type" class="w-full p-3 rounded bg-gray-700 text-white">
            <option value="">Choisir le type</option>
            <option value="">Film</option>
            <option value="">Séries</option>
        </select>
        <p id="error-type" class="text-red-500 text-sm"></p>

        <input type="number" id="releaseYear" placeholder="Année" class="w-full p-3 rounded bg-gray-700 text-white">
        <p id="error-releaseYear" class="text-red-500 text-sm"></p>


        <input type="url" id="image" placeholder="URL de l'image" class="w-full p-3 rounded bg-gray-700 text-white">
        <p id="error-image" class="text-red-500 text-sm"></p>

        <input type="number" id="duration" placeholder="Durée du film " class="w-full p-3 rounded bg-gray-700 text-white">
        <p id="error-duration" class="text-red-500 text-sm"></p>

        <input type="number" id="seasons" placeholder="Nombre de saisons" class="w-full p-3 rounded bg-gray-700 text-white">
        <p id="error-seasons" class="text-red-500 text-sm"></p>

        <input type="text" id="genres" placeholder="Action,Drama..." class="w-full p-3 rounded bg-gray-700 text-white">
        <p id="error-genres" class="text-red-500 text-sm"></p>

        <button id="submit-btn" type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
            Ajouter
        </button>

        <div id="message" class="text-center text-gray-300 mb-4">chargement...        
        </div>

        <div class="overflow-x-auto bg-gray-800 rounded-xl border border-gray-700">        
            <table class="w-full text-left text-gray-100">
                <thead class="bg-gray-700 text-red-400">
                    <tr>
                        <th class="p-4">Image</th>
                        <th class="p-4">Titre</th>
                        <th class="p-4">Type</th>
                        <th class="p-4">Année</th>
                        <th class="p-4">Actions</th>
                    </tr>
                </thead>

                <tbody id="contents-table">

                </tbody>
                </table>
        </div>
    </main>
    
    <footer class="bg-gray-800 border-t border-gray-700 p-4 text-center text-gray-400 ">2026 © CinéTrack. All rights reserved.</footer>
    
    <script type="module" src="js/admin.js"></script>    
</body>
</html>
